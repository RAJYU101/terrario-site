<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Safari表示確認（一時）</title>
<style>
  body{margin:0;padding:8px;font:12px/1.4 -apple-system,sans-serif;background:#ddd}
  .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .f{position:relative;background:#fff;overflow:hidden;outline:1px solid #999}
  .f b{position:absolute;left:0;top:0;z-index:2;background:#c00;color:#fff;padding:1px 4px;font-size:11px}
  .f iframe{border:0;transform:scale(.5);transform-origin:0 0;display:block}
  .d{width:640px;height:360px} .d iframe{width:1280px;height:720px}
  .m{width:195px;height:406px} .m iframe{width:390px;height:812px}
</style>
</head>
<body>
<div class="row">
  <div class="f d"><b>1 トップ：最初</b><iframe data-src="/" data-sel=""></iframe></div>
  <div class="f d"><b>2 トップ：任せられる業務</b><iframe data-src="/" data-sel="#home-service-title"></iframe></div>
</div>
<div class="row">
  <div class="f d"><b>3 トップ：料金</b><iframe data-src="/" data-sel="#home-price-title"></iframe></div>
  <div class="f d"><b>4 料金：プラン</b><iframe data-src="/price/" data-sel="#plans-title"></iframe></div>
</div>
<div class="row">
  <div class="f d"><b>5 サービス：分担表</b><iframe data-src="/service/" data-sel="#share-title"></iframe></div>
  <div class="f d"><b>6 サービス：資料の見本</b><iframe data-src="/service/" data-sel="#samples-title"></iframe></div>
</div>
<div class="row">
  <div class="f m"><b>7 スマホ：業務</b><iframe data-src="/" data-sel="#home-service-title"></iframe></div>
  <div class="f m"><b>8 スマホ：料金</b><iframe data-src="/price/" data-sel="#plans-title"></iframe></div>
  <div class="f m"><b>9 スマホ：分担表</b><iframe data-src="/service/" data-sel="#share-title"></iframe></div>
  <div class="f m"><b>10 スマホ：見本</b><iframe data-src="/service/" data-sel="#samples-title"></iframe></div>
  <div class="f m"><b>11 スマホ：お問い合わせ</b><iframe data-src="/contact/" data-sel="#contact-title"></iframe></div>
  <div class="f m"><b>12 スマホ：最初</b><iframe data-src="/" data-sel=""></iframe></div>
</div>
<script>
document.querySelectorAll('iframe').forEach(f => {
  f.addEventListener('load', () => {
    try {
      const d = f.contentDocument, w = f.contentWindow, sel = f.dataset.sel;
      const s = d.createElement('style');
      s.textContent = '.site-header,.sticky-cta,[id="sticky-cta"]{display:none!important} *{animation:none!important;transition:none!important} .rise,[data-reveal]{opacity:1!important;transform:none!important}';
      d.head.appendChild(s);
      if (sel) { const el = d.querySelector(sel); if (el) w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 60); }
    } catch (e) {}
  });
  f.src = f.dataset.src + '?v=' + Date.now();
});
</script>
</body>
</html>
